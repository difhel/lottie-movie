stages:
  - build
  - deploy_artifacts

build:
  stage: build
  image: node:latest
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy_artifacts:
  stage: deploy_artifacts
  script:
    - echo "Artifacts are stored for further use."
  dependencies:
    - build